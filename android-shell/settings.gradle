// Android playtest shell for CHURRASCO! O Mestre da Brasa.
// Build from this directory (`cd android-shell && gradle assembleRelease`) or let
// .github/workflows/android-playtest.yml do it and publish the APK to a release.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'churrasco-playtest'
include ':app'
