<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1C1512" />
<title>CHURRASCO! O Mestre da Brasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --carvao: #1C1512; --cinza: #3A2E28; --madeira: #7A4A2A; --madeira-clara: #B98A55;
    --creme: #F4E7D3; --offwhite: #FBF5EC; --brasa: #E0561F; --chama: #F2A63B;
    --verde: #6FA84A; --ambar: #E8B23C; --telha: #C0442E; --ouro: #E7C24A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0A0705; color: var(--creme);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    overscroll-behavior: none; touch-action: none; overflow: hidden;
  }
  #app {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 8%, #3B2418 0%, #1A100B 45%, #0A0705 100%);
  }
  #app::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 90%, rgba(224,86,31,0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(242,166,59,0.04) 0%, transparent 40%);
  }
  #stage { position: relative; z-index: 1; }
  canvas {
    display: block; border-radius: 24px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,214,160,0.08),
      0 0 120px rgba(224,86,31,0.10);
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="c"></canvas></div></div>
<script type="module" src="/bundle.js"></script>
</body>
</html>
